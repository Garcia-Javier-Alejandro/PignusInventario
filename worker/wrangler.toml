name = "pignusinventario-digest"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Runs at 09:00 Argentina time (UTC-3 = 12:00 UTC) on the 1st of every month.
[triggers]
crons = ["0 12 1 * *"]

[[d1_databases]]
binding = "DB"
database_name = "pignus-inventario-db"
database_id = "a54a3364-529c-48c7-ad4e-f9c5afc5c04e"
migrations_dir = "../migrations"

# Recipients are a plain env var — update here and redeploy to change the list.
# RESEND_API_KEY is a secret: wrangler secret put RESEND_API_KEY
[vars]
RECIPIENT_EMAILS = "garcia.javier.alejandro@gmail.com,graspatuzza@gmail.com,fiorespatuzza@gmail.com"
